<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 20px; font-family: Arial; }
        .container { display: flex; gap: 40px; }
        .box { width: 150px; height: 250px; }
        .original { 
            background: #ccc; 
            border-radius: 60px;
            label: "Original (60px)";
        }
        .capsule { 
            background: #333; 
            border-radius: 200px;
            label: "Capsule (200px)";
        }
        .label { margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <div class="box original"></div>
            <div class="label">Original (border-radius: 60px)</div>
        </div>
        <div>
            <div class="box capsule"></div>
            <div class="label">Capsule (border-radius: 200px)</div>
        </div>
    </div>
</body>
</html>
